services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: clinicq_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: clinicq
      POSTGRES_PASSWORD: clinicq_dev
      POSTGRES_DB: clinicq
    ports:
      - "5432:5432"
    volumes:
      - clinicq_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinicq -d clinicq"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  clinicq_pgdata:
    driver: local
